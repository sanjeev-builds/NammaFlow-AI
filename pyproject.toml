[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nammaflow-ai"
version = "0.1.0"
description = "NammaFlow AI - Intelligent Traffic & Crowd Management for Bengaluru"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "ultralytics",
    "requests",
    "fastapi",
    "uvicorn",
    # Previously used by src/traffic_ai/api.py, ml/, and the data_ingestion
    # daemons but never actually declared here.
    "pandas",
    "scikit-learn",
    "joblib",
    "torch",
    "networkx",
    "osmnx",
    "aiohttp",
    "httpx",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]
