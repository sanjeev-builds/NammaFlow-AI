[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nammaflow-ai"
version = "0.1.0"
description = "NammaFlow AI - Intelligent Traffic & Crowd Management for Bengaluru"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "ultralytics",
    "requests",
    "fastapi",
    "uvicorn"
]

[tool.setuptools.packages.find]
where = ["src"]
