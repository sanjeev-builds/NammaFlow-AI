<!DOCTYPE html>
<html>

<head>
    <title>NammaFlow AI Heatmap</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        #map {
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>

<body>

    <div id="map"></div>

    <script>

        var map = L.map('map').setView([12.9716, 77.5946], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: 'OSM'
        }).addTo(map);

        // Load GeoJSON natively
        fetch("bangalore_traffic.geojson")
            .then(res => res.json())
            .then(data => {

                function getColor(density) {
                    if (density > 0.7) return "red";
                    if (density > 0.4) return "orange";
                    return "green";
                }

                L.geoJSON(data, {
                    style: function (feature) {
                        return {
                            color: getColor(feature.properties.density),
                            weight: 2
                        };
                    }
                }).addTo(map);

            });

    </script>

</body>

</html>
